# The extractability gate (DESIGN.md §6): fl4-core must go through Charon
# and Aeneas without errors, typecheck in Lean, and keep its proofs green.
#
# Runs on a self-hosted runner labelled `fl4` that has the toolchain in
# ~/Projects/fl4-deps: Aeneas 0d21a9ec7bbbb110110cacc14464a47fd71c8705 with
# its pinned Charon (see charon-pin there), and elan for Lean.
name: gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: [self-hosted, fl4]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the kernel crates
        run: cargo build -p fl4-core && cargo build --release -p fl4-kernel --target x86_64-unknown-none
      - name: Host tests
        run: cargo test -p fl4-abi -p fl4-core -p fl4-arch-x86_64 -p xtask -p fl4-store
      - name: Trusted base
        run: cargo xtask trusted
      - name: Simulation
        run: cargo xtask sim --seeds 200
      - name: Mutation testing (the simulator catches known-broken runtimes)
        run: cargo xtask mutants
      - name: sel4test and fl4test under QEMU/KVM (DESIGN.md §12)
        run: |
          for setup in kvm kvm-reduced; do
            for n in 1 2 4; do
              cargo xtask sel4test --smp $n --setup $setup
              cargo xtask sel4test --smp $n --setup $setup --release
            done
            cargo xtask fl4test --setup $setup
            cargo xtask fl4test --setup $setup --smp 4
          done
      - name: Boot and runtime probe without virtualization
        run: FL4_TESTS='^FL4VCPU' cargo xtask fl4test --setup kvm-no-vm --smp 2
      - name: VCPU execution without a PMU
        run: |
          FL4_TESTS='^FL4VCPU' cargo xtask fl4test --setup kvm-no-pmu --smp 1
          FL4_TESTS='^FL4VCPU' cargo xtask fl4test --setup kvm-no-pmu --smp 4 --release
      - name: Differential fuzzing against seL4 (DESIGN.md §12)
        run: cargo xtask fuzz --setup kvm
      - name: Extract and prove (P0 must be complete)
        run: FL4_P0_STRICT=1 cargo xtask gate
