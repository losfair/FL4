[package]
name = "fl4-core"
description = "FL4 kernel logic: safe Rust, the Aeneas input (verified)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fl4-abi = { path = "../fl4-abi" }

[features]
# The AArch64 kernel: ARM objects, registers and interrupts (DESIGN.md §11).
# Without it fl4-core is the x86_64 core that the proofs are about.
aarch64 = ["fl4-abi/aarch64"]
