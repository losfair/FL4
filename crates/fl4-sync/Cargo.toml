[package]
name = "fl4-sync"
description = "FL4 transaction runtime: lock table, serial gate (sim-tested)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fl4-abi = { path = "../fl4-abi" }
fl4-core = { path = "../fl4-core" }
fl4-store = { path = "../fl4-store" }

[features]
# Test only (DESIGN.md §13, M4): every entry takes the serial gate, as with
# a big lock, for differential runs against the transactional runtime.
serial-gate = []
# Mutation testing only (DESIGN.md §10).
mutant-gate-no-wait = []
mutant-gate-release = []
# The syscall fast paths beside the gate (run_syscall) without marking the
# core active, or without locking the endpoint and reply object.
mutant-local-no-active = []
mutant-local-no-lock = []
