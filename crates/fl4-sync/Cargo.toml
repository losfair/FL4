[package]
name = "fl4-sync"
description = "FL4 kernel entry runtime: serial gate and local paths (sim-tested)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fl4-abi = { path = "../fl4-abi" }
fl4-core = { path = "../fl4-core" }
fl4-store = { path = "../fl4-store" }

[features]
# Mutation testing only (DESIGN.md §10): the gate holder does not wait for
# active local paths, or a local path marks its core active without the
# store-load order of the handshake.
mutant-gate-no-wait = []
mutant-gate-release = []
# The syscall fast paths beside the gate (run_syscall) without marking the
# core active, or without locking the endpoint and reply object.
mutant-local-no-active = []
mutant-local-no-lock = []
