[package]
name = "fl4-sim"
description = "FL4 deterministic simulator and oracles (host binary)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fl4-abi = { path = "../fl4-abi" }
fl4-core = { path = "../fl4-core" }
fl4-sync = { path = "../fl4-sync" }
fl4-store = { path = "../fl4-store" }
corosensei = "0.3"
libc = "0.2"

[features]
# Test only: every kernel entry takes the serial gate.
serial-gate = ["fl4-sync/serial-gate"]
# Mutation testing (DESIGN.md §10): `cargo xtask mutants` checks that the
# simulator fails each of these known-broken runtimes.
mutant-skip-validation = ["fl4-store/mutant-skip-validation"]
mutant-no-publish = ["fl4-store/mutant-no-publish"]
mutant-clear-no-validate = ["fl4-store/mutant-clear-no-validate"]
mutant-gate-no-wait = ["fl4-sync/mutant-gate-no-wait"]
mutant-gate-release = ["fl4-sync/mutant-gate-release"]
mutant-local-no-active = ["fl4-sync/mutant-local-no-active"]
mutant-local-no-lock = ["fl4-sync/mutant-local-no-lock"]
