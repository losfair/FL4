[package]
name = "fl4-efi"
description = "FL4's UEFI loader (trusted): loads the embedded kernel and the root task"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fl4-efi"
path = "src/bin/fl4-efi.rs"
test = false
bench = false

[target.'cfg(target_arch = "aarch64")'.dependencies]
fl4-bootinfo = { path = "../fl4-bootinfo" }
