[package]
name = "fl4-kernel"
description = "The FL4 kernel image: boot, glue between fl4-core and the x86_64 backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]
test = false
bench = false

[dependencies]
fl4-abi = { path = "../fl4-abi" }
fl4-core = { path = "../fl4-core" }
fl4-sync = { path = "../fl4-sync" }
fl4-store = { path = "../fl4-store" }
fl4-arch-x86_64 = { path = "../fl4-arch-x86_64" }

[features]
release-profile = ["fl4-abi/release-profile"]
