[package]
name = "fl4-kernel-aarch64"
description = "The FL4 kernel image for AArch64: boot, glue between fl4-core and the AArch64 backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]
test = false
bench = false

[dependencies]
fl4-abi = { path = "../fl4-abi", features = ["aarch64"] }
fl4-core = { path = "../fl4-core", features = ["aarch64"] }
fl4-sync = { path = "../fl4-sync" }
fl4-store = { path = "../fl4-store" }
fl4-arch-aarch64 = { path = "../fl4-arch-aarch64" }
fl4-bootinfo = { path = "../fl4-bootinfo" }

[features]
release-profile = ["fl4-abi/release-profile"]
